name: Campus event intake
on:
  pull_request:
    paths:
      - 'app/scripts/campus-intake/**'
      - 'app/scripts/refresh-campus-events.mjs'
      - 'app/data/campus-event-sources.json'
      - '.github/workflows/campus-event-intake.yml'
  workflow_dispatch:
    inputs:
      collect:
        description: 'Run approved read-only collection (requires repository approval variable)'
        type: boolean
        default: false
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: campus-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test app/scripts/campus-intake/intake.test.mjs
      - run: node app/scripts/refresh-campus-events.mjs
  collect:
    needs: offline-tests
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)) && vars.SIDEQUEST_CAMPUS_FEED_APPROVED == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public source review candidates
        env:
          SIDEQUEST_CAMPUS_FEED_APPROVED: 'yes'
        run: node app/scripts/refresh-campus-events.mjs --approved-read --output intake-output/scu-events.json
      - uses: actions/upload-artifact@v4
        with:
          name: scu-event-review-snapshot
          path: intake-output/scu-events.json
          if-no-files-found: error
          retention-days: 7
