name: SideQuest design review browser tests
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/design-review-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/design-review-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run design-review scenarios (local sample data only)
        run: npm run test:ux
      - name: Upload design-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidequest-design-review-evidence
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 14
