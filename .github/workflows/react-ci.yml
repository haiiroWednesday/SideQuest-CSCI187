name: SideQuest React CI

# GitHub automatically runs this workflow on pushes and pull requests.
# A green run means the commands below succeeded for that exact commit.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sidequest-ci-fixture
          POSTGRES_DB: sidequest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # npm ci uses the checked-in package-lock.json for repeatable installs.
      - name: Install locked packages
        run: npm ci --no-audit --no-fund
      - name: Verify formatting and source lint
        run: npm run format:check && npm run lint
      - name: Verify isolated PostgreSQL grants, RLS and constraints
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: sidequest-ci-fixture
          PGDATABASE: sidequest_test
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql -v ON_ERROR_STOP=1 -c 'create role anon nologin; create role authenticated nologin;'
          psql -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261103000000_create_events.sql
          psql -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261108000000_event_date_sanity_bound.sql
          psql -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261110000000_event_date_posting_horizon.sql
          psql -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261111000000_event_text_posting_rules.sql
          psql -v ON_ERROR_STOP=1 -f ../supabase/tests/event_date_sanity_bound.sql
          psql -v ON_ERROR_STOP=1 -f ../supabase/tests/event_date_posting_horizon.sql
          psql -v ON_ERROR_STOP=1 -f ../supabase/tests/event_text_posting_rules.sql
          psql -v ON_ERROR_STOP=1 -f ../supabase/tests/event_catalog_permissions.sql
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage
      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidequest-code-coverage
          path: app/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify Kandel rubric evidence and clean-code safeguards
        run: npm run test:rubric
      - name: Verify targeted interval mutation pilot
        run: npm run test:mutation:pilot
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium firefox webkit
      # The final check drives Chromium through a real user workflow.
      - name: Run browser smoke test
        run: npm run test:e2e
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidequest-browser-evidence
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 14
