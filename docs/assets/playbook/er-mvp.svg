<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-label="Simple MVP conceptual ER diagram EventCatalog contains Event, Schedule plans Events, Event has hostName but no USER account table"><rect width="1180" height="650" rx="20" fill="#faf8f3"/><text x="34" y="45" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#24343b">SideQuest MVP • simple conceptual ER view</text><text x="34" y="73" font-family="Arial,sans-serif" font-size="15" fill="#687576">The three P4 model classes are shown as entities; the physical shared database needs only posted Event records.</text><rect x="60" y="180" width="235" height="94" fill="#f5e5e9" stroke="#93354c" stroke-width="2.5"/><text x="177.5" y="212" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2c3539">EventCatalog</text><text x="177.5" y="236" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5e6668">shared logical collection</text><rect x="820" y="175" width="264" height="100" fill="#f5e5e9" stroke="#93354c" stroke-width="2.5"/><text x="952" y="207" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2c3539">Event</text><text x="952" y="231" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5e6668">publicly stored record</text><rect x="60" y="425" width="235" height="95" fill="#f5e5e9" stroke="#93354c" stroke-width="2.5"/><text x="177.5" y="457" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2c3539">Schedule</text><text x="177.5" y="481" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5e6668">planned IDs on one device</text><polygon points="544,169 636.5,225 544,281 451.5,225" fill="#fff0d7" stroke="#b7862d" stroke-width="2"/><text x="544" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#523b19">contains</text><polygon points="548,410 640.5,466 548,522 455.5,466" fill="#fff0d7" stroke="#b7862d" stroke-width="2"/><text x="548" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#523b19">plans to attend</text><path d="M295 224 L451 225" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M640 225 L820 225" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M295 470 L455 466" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M642 466 L952 275" stroke="#5c7072" stroke-width="2.2" fill="none"/><ellipse cx="840" cy="112" rx="91" ry="29" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="840" y="117" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">eventId (key)</text><ellipse cx="1052" cy="114" rx="91" ry="29" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="1052" y="119" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">hostName</text><ellipse cx="1081" cy="332" rx="78" ry="26" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="1081" y="337" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">title</text><ellipse cx="878" cy="342" rx="98" ry="28" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="878" y="347" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">description</text><ellipse cx="700" cy="338" rx="85" ry="27" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="700" y="343" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">location</text><ellipse cx="717" cy="403" rx="87" ry="27" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="717" y="408" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">startsAt</text><ellipse cx="878" cy="404" rx="80" ry="27" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="878" y="409" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">endsAt</text><ellipse cx="1061" cy="408" rx="91" ry="27" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" stroke-dasharray="7 5"/><text x="1061" y="413" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">posterId?</text><path d="M904 175 L840 142" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M989 175 L1049 145" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M1002 275 L1064 308" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M925 275 L886 314" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M823 266 L763 322" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M820 278 L765 382" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M886 275 L885 377" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M1015 274 L1054 381" stroke="#5c7072" stroke-width="2.2" fill="none"/><ellipse cx="174" cy="116" rx="94" ry="28" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="174" y="121" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">catalogId?</text><ellipse cx="165" cy="593" rx="96" ry="28" fill="#e6f0f1" stroke="#297d82" stroke-width="1.7" /><text x="165" y="598" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#26393d">scheduleId</text><path d="M171 143 L172 180" stroke="#5c7072" stroke-width="2.2" fill="none"/><path d="M167 520 L165 565" stroke="#5c7072" stroke-width="2.2" fill="none"/><text x="39" y="630" font-family="Arial,sans-serif" font-size="14" fill="#5e6668">hostName is self-reported; posterId is optional/unverified. Schedule storage stays local. No login or USER table.</text></svg>