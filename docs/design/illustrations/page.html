<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fbf6ed"><canvas id="c"></canvas>
<script type="module">
import { Art } from './engine.mjs';
const q = new URLSearchParams(location.search);
const m = await import('./scenes/' + q.get('scene') + '.mjs');
const [W, H] = m.size, A = new Art(document.getElementById('c'), W, H, +(q.get('s') || 2), q.get('style') || 'ink', +(q.get('seed') || 1));
const t0 = performance.now(); m.draw(A); window.ms = performance.now() - t0;
window.png = A.cv.toDataURL('image/png'); window.done = true;
</script>
