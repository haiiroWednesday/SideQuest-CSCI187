  const streams = [-1, 1].map(s => { const pv = grp([0, s * .05, 0], tp), g = grp([0, 0, 0], pv); pv.rotation.z = s * 13 * D; const st = new T.Mesh(cyl, mTail); st.scale.set(.014, .44, .014); st.rotation.z = 90 * D; st.position.set(-.36, 0, 0); g.add(st); ell(mGold, [-.64, 0, 0], [.095, .03, .095], null, g); return g })
  // wings: four ghosts a side, so a fast beat reads as a dark blur and a folded wing reads solid
  const wings = []
  for (const s of [-1, 1]) for (let k = 0; k < 4; k++) { const g = grp([.2, s * .28, .2]), m = mat('wing', 0, .5); for (let i = 0; i < 7; i++) { const t = i / 6, a = (-4 + t * 46) * D, L = 1.12 - .6 * t, f = new T.Mesh(sph, m); f.position.set(Math.cos(a) * L * .52, Math.sin(a) * L * .52, 0); f.scale.set(L * .5, .09, .02); f.rotation.z = a; g.add(f) } wings.push({ g, s, k }) }
  const feet = grp([0, 0, -.3]); for (const s of [1, -1]) { const l = new T.Mesh(cyl, mInk); l.scale.set(.02, .16, .02); l.rotation.x = 90 * D; l.position.set(.02, s * .12, -.06); feet.add(l); const f = new T.Mesh(cyl, mInk); f.scale.set(.02, .2, .02); f.rotation.z = 90 * D; f.position.set(.06, s * .12, -.14); feet.add(f) }
  const softMeshes = []; scene.traverse(o => { if (o.isMesh && crisp.indexOf(o) < 0) softMeshes.push(o) })
  const paint = k => { const c = COATS[k], set = (key, a, b) => (mats[key] || []).forEach(m => { m.uniforms.uA.value.set(a); if (b) m.uniforms.uB.value.set(b) }); set('body', c.back, c.belly); set('head', c.head); set('throat', c.throat); set('wing', c.wing); set('tail', c.tail); set('gold', c.gold) }
  const cam = new T.OrthographicCamera(-1.95, 1.95, 1.3, -1.3, .1, 50), yaw = 20 * D, el = 5 * D, tgt = V(0, .85, 0); cam.position.copy(tgt.clone().add(V(Math.sin(yaw) * Math.cos(el), Math.sin(el), Math.cos(yaw) * Math.cos(el)).multiplyScalar(10))); cam.lookAt(tgt)
  const mk = id => { const r = new T.WebGLRenderer({ canvas: document.getElementById(id), antialias: true, alpha: true }); r.setClearColor(0, 0); return r }
  const rs = mk('sq-soft'), rc = mk('sq-crisp')
  const fit = () => { const w = stage.clientWidth, h = Math.round(w * 2 / 3), pr = Math.min(window.devicePixelRatio || 1, 2); [rs, rc].forEach(r => { r.setPixelRatio(pr); r.setSize(w, h, false) }); rs.domElement.style.filter = 'blur(' + (w * .0036).toFixed(2) + 'px)'; rc.domElement.style.filter = 'blur(' + (w * .0006).toFixed(2) + 'px)' }
  fit(); window.addEventListener('resize', fit)
  // behaviours
  const ST = { Hover: { x: .05, z: .08, pitch: -36, hp: 30, hr: 0, hy: 0, flap: 1, bob: .06, sweep: 0 }, Sip: { x: .4, z: .02, pitch: -20, hp: 26, hr: 0, hy: 0, flap: 1, bob: .025, sweep: 0 }, Rest: { x: -.1, z: -.06, pitch: -32, hp: 28, hr: 0, hy: -10, flap: 0, bob: 0, sweep: 0 }, Tilt: { x: -.1, z: -.06, pitch: -32, hp: 22, hr: -26, hy: -18, flap: 0, bob: 0, sweep: 0 }, Dart: { x: -.1, z: .1, pitch: -6, hp: 4, hr: 0, hy: 0, flap: 1, bob: 0, sweep: 1 } }
  let state = 'Hover', coat = 'A', cur = Object.assign({}, ST.Hover), t0 = 0, dartT = -1, ang = [-.5, -.5], lastZ = 0, last = performance.now()
  const slow = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? .4 : 1
  const show = (id, on) => { document.getElementById(id).style.opacity = on ? 1 : 0 }
  const setState = s => { state = s; if (s === 'Dart') dartT = 0; show('sq-wire', s === 'Rest' || s === 'Tilt'); show('sq-flower', s === 'Sip'); show('sq-speed', s === 'Dart'); [...document.querySelectorAll('#sq-states button')].forEach(b => b.setAttribute('aria-pressed', b.textContent === s)) ; style() }
  const style = () => { [...document.querySelectorAll('#sq-states button')].forEach(b => { const on = b.textContent === state; b.style.background = on ? '#751728' : 'transparent'; b.style.color = on ? '#fff' : 'var(--text-primary, #2b1418)'; b.style.borderColor = on ? '#751728' : 'var(--border-strong, #c9b9ac)' }); [...document.querySelectorAll('#sq-coats button')].forEach(b => { b.style.boxShadow = b.dataset.k === coat ? '0 0 0 2px var(--surface-2, #fff), 0 0 0 4px ' + COATS[b.dataset.k].dot : 'none' }) }
  Object.keys(ST).forEach(s => { const b = document.createElement('button'); b.textContent = s; b.style.cssText = 'font:500 13px var(--font-sans, system-ui);padding:7px 14px;border-radius:999px;border:1px solid;cursor:pointer'; b.onclick = () => setState(s); document.getElementById('sq-states').appendChild(b) })
  Object.keys(COATS).forEach(k => { const b = document.createElement('button'); b.dataset.k = k; b.setAttribute('aria-label', 'Coat ' + k); b.style.cssText = 'width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;background:' + COATS[k].dot; b.onclick = () => { coat = k; paint(k); style() }; document.getElementById('sq-coats').appendChild(b) })
  paint(coat); setState('Hover')
  const basis = new T.Matrix4()
  let manual = false
  function step(dt) { t0 += dt; const t = t0, tg = ST[state], k = 1 - Math.exp(-dt * (state === 'Dart' ? 9 : 5))
    for (const key in tg) cur[key] += (tg[key] - cur[key]) * k
    let x = cur.x, sx = 1
    if (state === 'Dart') { dartT += dt; const u = dartT / 1.5; if (u < .34) x = cur.x + Math.pow(u / .34, 2.2) * 3.2; else if (u < 1) { const v = (u - .34) / .66; x = -3.2 + (1 - Math.pow(1 - v, 3)) * (3.2 + cur.x) } else setState('Hover'); sx = 1 + .22 * Math.sin(Math.min(1, u) * Math.PI) }
    const bob = Math.sin(t * 2.3) * cur.bob + Math.sin(t * 5.1) * cur.bob * .25, breathe = 1 + (1 - cur.flap) * .018 * Math.sin(t * 2.2), z = .62 + cur.z + bob

</script>
