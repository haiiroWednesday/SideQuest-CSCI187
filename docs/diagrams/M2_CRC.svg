<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#38516c" stroke-width="1.5"/></marker></defs><rect width="1600" height="100%" fill="#faf8f4"/>
<text x="60" y="55" font-family="Arial,sans-serif" font-size="34" fill="#21344a" font-weight="bold">SideQuest | Current M2 responsibilities</text>
<text x="60" y="91" font-family="Arial,sans-serif" font-size="19" fill="#21344a" font-weight="normal">Views call Controllers. Models own domain rules and data. Transport retains all database keys on the server.</text>
<rect x="60" y="125" width="1480" height="100" rx="12" fill="#edf2f7" stroke="#38516c" stroke-width="2"/>
<text x="82" y="160" font-family="Arial,sans-serif" font-size="24" fill="#21344a" font-weight="bold">Views: Discover | Post an event | My Schedule</text>
<text x="82" y="191" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Render prepared output, collect input and manage keyboard focus. No direct persistence or Model imports.</text>
<rect x="60" y="290" width="1480" height="130" rx="12" fill="#fff2da" stroke="#38516c" stroke-width="2"/>
<text x="82" y="325" font-family="Arial,sans-serif" font-size="24" fill="#21344a" font-weight="bold">Controllers: postEvent | findEvents | sharedSchedule | presentScreens</text>
<text x="82" y="356" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Coordinate commands and asynchronous reads; prepare presentation text and states.</text>
<text x="82" y="387" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">HTTP Controller: server/api.ts mediates shared catalog requests; local plans remain on the current device.</text>
<rect x="60" y="510" width="450" height="300" rx="12" fill="#edf4ec" stroke="#38516c" stroke-width="2"/>
<text x="82" y="545" font-family="Arial,sans-serif" font-size="24" fill="#21344a" font-weight="bold">Event</text>
<text x="82" y="576" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Knows: ID, title, host, description,</text>
<text x="82" y="607" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">location, campus date/start/end.</text>
<text x="82" y="638" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Does: validate fields and posting time;</text>
<text x="82" y="669" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">full-fit and interval/clock rules.</text>
<text x="82" y="700" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Collaborators: EventCatalog, Schedule.</text>
<rect x="575" y="510" width="450" height="300" rx="12" fill="#edf4ec" stroke="#38516c" stroke-width="2"/>
<text x="597" y="545" font-family="Arial,sans-serif" font-size="24" fill="#21344a" font-weight="bold">EventCatalog</text>
<text x="597" y="576" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Knows: public Event records.</text>
<text x="597" y="607" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Does: create, listUpcoming, getById;</text>
<text x="597" y="638" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">validate and map store data.</text>
<text x="597" y="669" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Collaborators: Event and table adapter.</text>
<text x="597" y="700" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">HTTP client / server-side Supabase.</text>
<rect x="1090" y="510" width="450" height="300" rx="12" fill="#edf4ec" stroke="#38516c" stroke-width="2"/>
<text x="1112" y="545" font-family="Arial,sans-serif" font-size="24" fill="#21344a" font-weight="bold">Schedule</text>
<text x="1112" y="576" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Knows: current-device Event IDs.</text>
<text x="1112" y="607" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Does: add/remove/recover plans;</text>
<text x="1112" y="638" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">capacity, chronology and overlaps.</text>
<text x="1112" y="669" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Collaborators: Event, EventCatalog.</text>
<text x="1112" y="700" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Removing a plan keeps the Event.</text>
<path d="M800 225 L800 290" stroke="#38516c" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M285 420 L285 510" stroke="#38516c" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800 420 L800 510" stroke="#38516c" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1315 420 L1315 510" stroke="#38516c" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M575 670 L510 670" stroke="#38516c" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1090 670 L1025 670" stroke="#38516c" fill="none" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="60" y="905" font-family="Arial,sans-serif" font-size="19" fill="#21344a" font-weight="normal">P4 is professor-approved and unchanged. This is the current implementation mapping.</text>
</svg>