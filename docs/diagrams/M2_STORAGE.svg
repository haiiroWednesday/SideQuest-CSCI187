<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#38516c" stroke-width="1.5"/></marker></defs><rect width="1600" height="100%" fill="#faf8f4"/>
<text x="60" y="55" font-family="Arial,sans-serif" font-size="34" fill="#21344a" font-weight="bold">SideQuest | Current M2 storage and ER</text>
<text x="60" y="91" font-family="Arial,sans-serif" font-size="19" fill="#21344a" font-weight="normal">One implemented SQL entity. Personal plan references and the search window are explicitly outside the shared database.</text>
<rect x="60" y="150" width="760" height="620" rx="12" fill="#edf4ec" stroke="#38516c" stroke-width="2"/>
<text x="82" y="185" font-family="Arial,sans-serif" font-size="24" fill="#21344a" font-weight="bold">public.events | shared SQL entity</text>
<text x="82" y="216" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">id: UUID PRIMARY KEY, generated by database</text>
<text x="82" y="247" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">title: text, required, maximum 120</text>
<text x="82" y="278" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">host_name: text, required, maximum 120</text>
<text x="82" y="309" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">description: text, required, maximum 2000</text>
<text x="82" y="340" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">location: text, required, maximum 200</text>
<text x="82" y="371" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">event_date: date (California campus calendar)</text>
<text x="82" y="402" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">start_time, end_time: same-day wall times</text>
<text x="82" y="433" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">created_at: timestamptz, generated by database</text>
<text x="82" y="464" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Constraint: start_time &lt; end_time</text>
<text x="82" y="495" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">RLS: anonymous SELECT and bounded INSERT</text>
<text x="82" y="526" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">No anonymous UPDATE or DELETE.</text>
<rect x="1000" y="150" width="540" height="290" rx="12" fill="#edf2f7" stroke="#38516c" stroke-width="2"/>
<text x="1022" y="185" font-family="Arial,sans-serif" font-size="24" fill="#21344a" font-weight="bold">Current-device local storage</text>
<text x="1022" y="216" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">sidequest.planned-event-ids.v1</text>
<text x="1022" y="247" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">JSON array of unique Event ID strings.</text>
<text x="1022" y="278" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Provisional maximum: 100 IDs.</text>
<text x="1022" y="309" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Not a SQL table or a user account.</text>
<text x="1022" y="340" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">References can be missing or unavailable.</text>
<text x="1022" y="371" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Remove changes this array only.</text>
<rect x="1000" y="530" width="540" height="180" rx="12" fill="#fff2da" stroke="#38516c" stroke-width="2"/>
<text x="1022" y="565" font-family="Arial,sans-serif" font-size="24" fill="#21344a" font-weight="bold">Transient search input</text>
<text x="1022" y="596" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">date, start, end: held in View state.</text>
<text x="1022" y="627" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">Used for full-fit matching.</text>
<text x="1022" y="658" font-family="Arial,sans-serif" font-size="20" fill="#21344a" font-weight="normal">No saved availability table.</text>
<path d="M1000 370 L820 370" stroke="#38516c" fill="none" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="922.0" y="356.0" font-family="Arial,sans-serif" font-size="16" fill="#21344a" font-weight="normal">ID lookup</text>
<text x="60" y="905" font-family="Arial,sans-serif" font-size="19" fill="#21344a" font-weight="normal">P4 is professor-approved and unchanged. This is the current implementation mapping.</text>
</svg>